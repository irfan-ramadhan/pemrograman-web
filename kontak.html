<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Restaurant Bunda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
    <div class="logo">Restaurant Bunda</div>
    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="gallery.html">GALLERY</a>
        <a href="kontak.html">KONTAK</a>
    </nav>
    </header>

    <section class="hero">
        <h1>Hubungi Kami</h1>
        <p>Silakan hubungi Restaurant Bunda untuk informasi lebih lanjut.</p>
    </section>

    <main class="container">
        <div class="info-grid">
            <div class="card">
                <h3>Informasi Kontak</h3>
                <p><strong>Alamat:</strong><br>Jl. Arjuna Raya No. 3, Tangerang, Banten</p>
                <br>
                <p><strong>Telepon:</strong><br>(021) 568-987-432</p>
                <br>
                <p><strong>Jam Buka:</strong><br>10.00 - 22.00 WIB</p>
            </div>

            <div class="contact-form">
                <h3>Kirim Pesan</h3>
                <form action="#" method="post">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email">

                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" placeholder="Tulis pesan Anda"></textarea>

                    <button class="button" type="submit">Kirim Pesan</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Restaurant Bunda.
    </footer>
</body>
</html>
